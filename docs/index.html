<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FRAME 0004</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#080910;color:#d8e5e8;font:16px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;display:grid;place-items:center}.frame{max-width:720px;padding:32px;width:100%}.hall{height:min(54vw,380px);background:linear-gradient(90deg,#0c0d17 0 31%,#1b2230 31% 35%,#060811 35% 65%,#1b2230 65% 69%,#0c0d17 69%);border:1px solid #51616c;position:relative;overflow:hidden}.door{position:absolute;left:43%;width:14%;top:20%;height:65%;background:#07131a;border:2px solid #6aa9af;box-shadow:0 0 30px #2db8d559;transform:skewY(-1deg)}.door.open{transform:perspective(600px) rotateY(55deg);transform-origin:left;box-shadow:25px 0 50px #66d8ed80}.glow{position:absolute;left:44%;top:21%;width:12%;height:63%;background:#93edff;filter:blur(30px);opacity:.3}.caption{letter-spacing:.1em;color:#9db9bf}button{border:1px solid #75b5be;background:#101922;color:#d8edf0;font:inherit;padding:10px 15px;cursor:pointer}button:hover{background:#203744}small{display:block;color:#85999e;margin-top:22px}</style></head>
<body><main class="frame"><p class="caption">ARCHIVE / FRAME 0004</p><div class="hall"><div class="glow"></div><div class="door" id="door"></div></div><p id="line">The hallway is empty.</p><button id="check">Check the door</button><small>A fictional micro-story. Nothing is tracked or uploaded.</small></main><script>const door=document.getElementById('door'),line=document.getElementById('line'),button=document.getElementById('check');let n=0;button.addEventListener('click',()=>{n++;door.classList.toggle('open',n%2===1);line.textContent=['The hallway is empty.','The door was already open.','It was closed when you arrived.','The archive says you have always been here.'][Math.min(n,3)];button.textContent=n>=3?'Close the archive':'Check again'});</script></body></html>
